site_name: Motion Capture Software
nav:
  - Software Operation Guide: ms_manual.md
  - Data Import: dimport.md
theme:
  name: material
  features:
    - content.code.copy
  logo: assets/logo.png
plugins:
  - mkdocs-video
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
extra:
  homepage: https://moretion.github.io/en/
